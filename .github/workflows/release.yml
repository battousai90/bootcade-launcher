name: Release

# Fully automatic: any push to main that touches the app bumps the patch
# version, tags it, and publishes a release : no manual CMakeLists.txt edit,
# no manual tag push. The landing page always points at /releases/latest, so
# it never needs touching either.
#
# To rebuild a specific past release (e.g. after fixing a packaging bug),
# use workflow_dispatch with that tag : it skips the bump entirely.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'assets/**'
      - 'locale/**'
      - 'packaging/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (e.g. v1.0.1) : leave empty for a normal auto-bump run'
        required: false

permissions:
  contents: write

jobs:
  # Resolves what to release: either the tag given to workflow_dispatch, or a
  # fresh patch bump on top of CMakeLists.txt's current version. Runs first so
  # package/flatpak can both build the exact same, already-tagged commit.
  version:
    # The bump below pushes to main with the default token, which GitHub does
    # NOT re-trigger workflows for : so this guard is a belt-and-braces check,
    # not the actual loop prevention.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the release tag
        id: resolve
        run: |
          # A silent partial failure here (e.g. the push to main rejected while
          # the tag push still goes through) must never pass as success : that
          # is exactly what let CMakeLists.txt's version drift away from the
          # real tags for several releases in a row without anyone noticing.
          set -euo pipefail

          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "Rebuilding existing tag ${{ github.event.inputs.tag }}"
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La version PUBLIEE est celle declaree dans CMakeLists.txt, telle
          # quelle. Le CI ne la devine plus.
          #
          # Il la devinait auparavant en ajoutant 1 au dernier tag, ce qui ne
          # pouvait produire que des PATCH : une machine ne peut pas savoir
          # qu'une livraison apporte des fonctionnalites. Une version mineure
          # etait donc silencieusement republiee en correctif, et le numero
          # declare par le developpeur passait a la trappe. C'est desormais lui
          # qui decide, au debut du travail, selon SemVer.
          LATEST_TAG="$(git tag --list 'v*' | sort -V | tail -1)"
          CUR="${LATEST_TAG#v}"
          NEW="$(sed -n 's/^project(bootcade VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$NEW" ] || { echo "!! no version declared in CMakeLists.txt" >&2; exit 1; }

          # Republier un numero deja sorti, ou anterieur, est refuse net :
          # c'est le seul moyen que la version publiee ne recule jamais.
          if [ -n "$CUR" ] && [ "$NEW" = "$CUR" ]; then
            echo "!! CMakeLists.txt declares $NEW, already published : bump it (SemVer) before merging" >&2
            exit 1
          fi
          if [ -n "$CUR" ] && [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "!! CMakeLists.txt declares $NEW but v$CUR is already published : the version cannot go backwards" >&2
            exit 1
          fi
          echo "Publishing $NEW (declared in CMakeLists.txt, latest published: ${CUR:-none})"

          # Le manifeste AppStream, sans quoi le magasin ment. C'est LUI que
          # lisent GNOME Logiciels et Discover, pas le binaire : faute de mise
          # a jour ici, onze versions se sont succede pendant que l'utilisateur
          # voyait toujours 1.0.1, avec un historique arrete au 3 aout.
          #
          # Le resume vient du dernier commit humain, donc du titre de la pull
          # request fusionnee : c'est deja la phrase qui decrit la livraison.
          # Le corps du commit de fusion porte le titre de la pull request, qui
          # est la phrase qui decrit la livraison. Son SUJET, lui, vaut
          # "Merge pull request #43 from battousai90/Dev" : sans interet dans
          # un magasin d'applications. Quand le titre se reduit au nom de la
          # branche, on retombe sur le dernier vrai commit.
          NOTES="$(git log --perl-regexp --author='^(?!github-actions\[bot\]).*' -1 --format=%b | head -1)"
          case "$NOTES" in ""|Dev|main)
            NOTES="$(git log --no-merges --perl-regexp --author='^(?!github-actions\[bot\]).*' -1 --format=%s)" ;;
          esac
          [ -n "$NOTES" ] || NOTES="Maintenance release."
          python3 - "$NEW" "$NOTES" <<'PYEOF'
          import sys, datetime, html
          version, notes = sys.argv[1], sys.argv[2]
          path = "packaging/io.github.battousai90.Bootcade.metainfo.xml"
          s = open(path, encoding="utf-8").read()
          if f'version="{version}"' not in s:
              entry = (f'    <release version="{version}" '
                       f'date="{datetime.date.today().isoformat()}">\n'
                       f'      <description>\n'
                       f'        <p>{html.escape(notes)}</p>\n'
                       f'      </description>\n'
                       f'    </release>\n')
              s = s.replace("  <releases>\n", "  <releases>\n" + entry, 1)
              open(path, "w", encoding="utf-8").write(s)
          PYEOF
          appstreamcli validate --no-net packaging/*.metainfo.xml || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CMakeLists.txt porte deja le bon numero : seul le manifeste
          # AppStream reste a completer, et il peut deja l'etre (relance,
          # entree ajoutee a la main). Un "commit -am" sur un arbre propre
          # echoue, et ferait echouer la publication pour rien.
          git diff --quiet || git commit -am "Release $NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push origin HEAD:main
          git push origin "v$NEW"

          # Redescendre le bump sur Dev. Sans cela Dev reste en arriere d'un
          # commit a chaque publication, et la pull request suivante s'ouvre
          # en conflit sur CMakeLists.txt et le manifeste AppStream, les deux
          # fichiers que cette etape vient justement de modifier. C'est arrive
          # a chaque version depuis la 1.0.13.
          #
          # Sans consequence si la fusion echoue : la publication est faite,
          # et la resynchronisation se rattrape a la main. Mieux vaut ne pas
          # faire echouer une release pour ca.
          git fetch origin Dev
          if git merge --no-edit origin/Dev -m "Merge Dev after release $NEW"; then
            git push origin HEAD:Dev || echo "!! Dev non resynchronise, a faire a la main" >&2
          else
            git merge --abort || true
            echo "!! Dev non resynchronise (conflit), a faire a la main" >&2
          fi
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-24.04   # oldest supported glibc → widest compatibility
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config file desktop-file-utils \
            libgtkmm-3.0-dev libpugixml-dev nlohmann-json3-dev \
            libcurl4-openssl-dev libzip-dev libarchive-dev \
            zlib1g-dev libsqlite3-dev \
            libfuse2 patchelf librsvg2-dev

      - name: Build .deb, .tar.gz and AppImage
        run: ./scripts/package.sh deb tgz appimage

      - name: Verify the AppImage starts
        run: |
          APP=$(ls dist/*.AppImage)
          chmod +x "$APP"
          "$APP" --appimage-extract >/dev/null
          test -f squashfs-root/usr/share/bootcade/assets/logo.svg
          test -f squashfs-root/usr/share/bootcade/locale/fr.json
          echo "AppImage payload looks right"

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS

  # Flatpak needs its own runtime image, so it runs separately and is allowed to
  # fail without holding back the other packages.
  flatpak:
    # Apres « package » : son SHA256SUMS doit exister pour qu'on y ajoute la
    # ligne du Flatpak (voir plus bas).
    needs: [version, package]
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      # Must match runtime-version in the manifest. bilelmoussaoui/flatpak-github-actions
      # (Docker Hub) is unmaintained and stuck at gnome-47 : the project moved to
      # ghcr.io/flathub-infra, which actually publishes current GNOME runtime images.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bootcade.flatpak
          manifest-path: packaging/io.github.battousai90.Bootcade.yml
          # Nommee d'apres le manifeste et non d'apres la version : une cle par
          # tag n'etait jamais retrouvee a la release suivante, qui recompilait
          # alors gtkmm et toute sa pile (une dizaine de minutes). Ici, seul un
          # changement de bibliotheque dans le manifeste repart de zero.
          cache-key: flatpak-deps-${{ hashFiles('packaging/io.github.battousai90.Bootcade.yml') }}

      # Le bundle portait le meme nom a chaque version. Impossible de savoir
      # lequel on tient, et un navigateur enregistre le suivant sous
      # "bootcade(1).flatpak" en laissant l'ancien en place : on
      # reinstalle alors l'ancienne version en croyant faire la mise a jour.
      # Les trois autres paquets portent deja leur version dans le nom.
      - name: Name the bundle after its version
        run: mv bootcade.flatpak "bootcade-${{ needs.version.outputs.tag }}-x86_64.flatpak"

      # SHA256SUMS est publie par « package », avant que le Flatpak n'existe :
      # il n'en contenait donc jamais l'empreinte, et la mise a jour
      # automatique d'une installation Flatpak echouait faute de pouvoir
      # verifier le fichier. On reprend le fichier de « package », on y
      # ajoute la ligne du Flatpak, et on le republie avec le paquet.
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Add the bundle to SHA256SUMS
        run: |
          cp packages/SHA256SUMS SHA256SUMS
          sha256sum "bootcade-${{ needs.version.outputs.tag }}-x86_64.flatpak" >> SHA256SUMS
          cat SHA256SUMS

      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          overwrite_files: true
          files: |
            bootcade-${{ needs.version.outputs.tag }}-x86_64.flatpak
            SHA256SUMS
